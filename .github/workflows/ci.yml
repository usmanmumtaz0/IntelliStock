name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  services-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: intellistock
          POSTGRES_PASSWORD: ci-disposable-password
          POSTGRES_DB: intellistock_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U intellistock" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://intellistock:ci-disposable-password@localhost:5432/intellistock_test
      REDIS_URL: redis://localhost:6379/15
      JWT_SECRET: ci-only-secret-that-is-longer-than-thirty-two-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pip check
      - run: alembic upgrade head
      - run: python -m scripts.verify_services
      - run: python -m scripts.verify_cv_runtime

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///./ci-tests.sqlite3
      JWT_SECRET: ci-only-secret-that-is-longer-than-thirty-two-characters
      REDIS_URL: redis://127.0.0.1:1/15
      REDIS_SOCKET_TIMEOUT_SECONDS: "0.05"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_API_URL: http://127.0.0.1:8000/api/v1
          VITE_WS_URL: ws://127.0.0.1:8000/ws/inventory
