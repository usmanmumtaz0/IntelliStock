services:
  postgres:
    networks: [intellistock]
    image: postgres:16-alpine
    container_name: intellistock_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    networks: [intellistock]
    image: redis:7-alpine
    container_name: intellistock_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: intellistock_backend
    environment:
      CHAT_PROVIDER: ${CHAT_PROVIDER:-local}
      CHAT_MODEL: ${CHAT_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      CHAT_TIMEOUT_SECONDS: ${CHAT_TIMEOUT_SECONDS:-15}
      CHAT_MAX_TURNS: ${CHAT_MAX_TURNS:-100}
      CHAT_REQUESTS_PER_MINUTE: ${CHAT_REQUESTS_PER_MINUTE:-10}
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-false}
      NOTIFICATION_EMAIL_TO: ${NOTIFICATION_EMAIL_TO:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
      NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-5}
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL_DOCKER:?Set DATABASE_URL_DOCKER in .env}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RATE_LIMIT_LOGIN_REQUESTS: ${RATE_LIMIT_LOGIN_REQUESTS:-5}
      RATE_LIMIT_LOGIN_WINDOW_SECONDS: ${RATE_LIMIT_LOGIN_WINDOW_SECONDS:-60}
      VIDEO_STORAGE_ROOT: /app/media
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - intellistock

  worker:
    build: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL_DOCKER:?Set DATABASE_URL_DOCKER in .env}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    command: python -m app.workers.events
    depends_on:
      backend:
        condition: service_healthy
    networks: [intellistock]
    restart: unless-stopped

  video-worker:
    build: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL_DOCKER:?Set DATABASE_URL_DOCKER in .env}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CV_MODEL_PATH: /models/best.pt
      CV_MODEL_MANIFEST: ${CV_MODEL_MANIFEST_DOCKER:-/models/model-manifest.json}
      CV_DETECTOR: ${CV_DETECTOR:-yolov8}
      CV_DEVICE: ${CV_DEVICE:-auto}
      CV_NMS_IOU_THRESHOLD: ${CV_NMS_IOU_THRESHOLD:-0.45}
      CV_MAX_DETECTIONS: ${CV_MAX_DETECTIONS:-300}
      CV_IDENTITY_MIN_CONFIDENCE: ${CV_IDENTITY_MIN_CONFIDENCE:-0.65}
      CV_OCR_ENABLED: ${CV_OCR_ENABLED:-false}
      CV_OCR_LANGUAGE: ${CV_OCR_LANGUAGE:-en}
      CV_OCR_VERSION: ${CV_OCR_VERSION:-PP-OCRv6}
      CV_OCR_DEVICE: ${CV_OCR_DEVICE:-cpu}
      CV_OCR_MIN_CONFIDENCE: ${CV_OCR_MIN_CONFIDENCE:-0.55}
      CV_OCR_MATCH_MIN_CONFIDENCE: ${CV_OCR_MATCH_MIN_CONFIDENCE:-0.72}
      CV_OCR_MATCH_MIN_MARGIN: ${CV_OCR_MATCH_MIN_MARGIN:-0.10}
      CV_EMBEDDING_ENABLED: ${CV_EMBEDDING_ENABLED:-false}
      CV_EMBEDDING_MODEL_PATH: ${CV_EMBEDDING_MODEL_PATH_DOCKER:-}
      CV_EMBEDDING_DEVICE: ${CV_EMBEDDING_DEVICE:-cpu}
      CV_REFERENCE_IMAGE_ROOT: /app/media/product-references
      CV_RETRIEVAL_MIN_CONFIDENCE: ${CV_RETRIEVAL_MIN_CONFIDENCE:-0.82}
      CV_RETRIEVAL_MIN_MARGIN: ${CV_RETRIEVAL_MIN_MARGIN:-0.05}
      CV_MAX_REFERENCE_IMAGES: ${CV_MAX_REFERENCE_IMAGES:-500}
      CV_EVIDENCE_REFRESH_SHARPNESS_RATIO: ${CV_EVIDENCE_REFRESH_SHARPNESS_RATIO:-1.20}
      CV_IDENTITY_CACHE_ROOT: /app/media/model-cache
      VIDEO_STORAGE_ROOT: /app/media
      VIDEO_ALLOWED_CAMERA_HOSTS: ${VIDEO_ALLOWED_CAMERA_HOSTS:-}
    command: python -m app.workers.video_jobs
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./models:/models:ro
    networks: [intellistock]
    restart: unless-stopped

  notifications:
    build: ./backend
    profiles: [notifications]
    environment:
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL_DOCKER:?Set DATABASE_URL_DOCKER in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-false}
      NOTIFICATION_EMAIL_TO: ${NOTIFICATION_EMAIL_TO:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
      NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-5}
    command: python -m app.workers.notifications
    depends_on:
      backend:
        condition: service_healthy
    networks: [intellistock]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: intellistock_frontend
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
      VITE_WS_URL: ws://localhost:8000/ws/inventory
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 3000
    networks:
      - intellistock

volumes:
  postgres_data:
  redis_data:

networks:
  intellistock:
    driver: bridge
