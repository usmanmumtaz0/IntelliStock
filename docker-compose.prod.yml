services:
  backend:
    environment:
      APP_ENV: production
    volumes: !reset []
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  frontend:
    build:
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8000/ws/inventory}
    environment:
      PORT: 3000
    volumes: !reset []
    command: node .output/server/index.mjs
    restart: unless-stopped

  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped
